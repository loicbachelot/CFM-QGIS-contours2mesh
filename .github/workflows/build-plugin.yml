name: Build and Release QGIS Plugin

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # needed to upload assets to the release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # pyuic5/pyrcc5 are only needed if you compile .ui/.qrc. Safe to include.
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pb_tool
          sudo apt-get update
          sudo apt-get install -y zip pyqt5-dev-tools

      # Guardrails so we fail fast if the submodule wasn't pulled
      - name: Verify ccfm submodule present
        run: |
          test -f vendor/ccfm/pyproject.toml
          test -f vendor/ccfm/ccfm/__init__.py

      # (Optional) enforce the tag you expect for ccfm; update as you bump it
      # - name: Verify ccfm tag
      #   run: |
      #     cd contours2mesh/vendor/ccfm
      #     EXPECTED="v0.1.0"
      #     TAG=$(git describe --tags --exact-match || echo "NO_TAG")
      #     [ "$TAG" = "$EXPECTED" ] || { echo "ccfm not at $EXPECTED (got $TAG)"; exit 1; }

      - name: Build plugin zip
        run: |
          yes | pb_tool deploy
          yes | pb_tool zip
          ls -lah zip_build
          unzip -l zip_build/contours2mesh.zip | grep -E "vendor/ccfm/ccfm/__init__\.py"

      - name: Upload plugin .zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: zip_build/contours2mesh.zip
